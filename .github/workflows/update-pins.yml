# Keep the pinned commits current, and let a pin move be reviewed like any other change.
#
# WHY A PULL REQUEST RATHER THAN A DIRECT COMMIT
#
# The pins decide which version of each mod's docs a visitor reads. Moving one is therefore a content
# change -- a page can gain a section, lose one, or change what it says -- and it should be visible as
# such. Committing straight to `main` would deploy documentation changes nobody looked at, from a bot,
# at 03:00. A pull request costs one click and makes the change reviewable.
#
# It also means this workflow cannot deploy anything on its own. It edits one file and opens a PR;
# whether that lands is a decision.
#
# **This header was a `/** ... */` block until it was not, and the workflow never ran because of it.**
# GitHub reads this file as YAML, where that is not a comment: the file was rejected as unparseable, so
# the Monday cron below never registered and every push produced an instant failed run with no jobs in
# it. `refresh-stats.yml` had the same header and the same fate. AGENT.md records the whole failure.

name: Update pins

on:
  schedule:
    # Mondays at 03:00 UTC. Weekly is the right cadence: the docs move when somebody pushes, which is
    # not on a schedule, and a daily PR would mostly be empty.
    - cron: '0 3 * * 1'

  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Move every pin to its head
        run: bun run pins --write

      - name: Open a pull request if anything moved
        uses: peter-evans/create-pull-request@v7
        with:
          branch: pins/refresh
          title: 'chore: move docs pins to the current heads'
          commit-message: 'chore: move docs pins to the current heads'
          delete-branch: true
          body: |
            `manifest.json` pins each mod's docs to one commit, so a deploy is reproducible. This PR
            moves those pins to the current head of `main` in each repository.

            **What changed is which documentation the site describes.** A page may have gained a
            section, lost one, or changed what it says — the diff of the pin tells you nothing about
            that, so the way to review this is to open the build preview and read the pages that moved.

            Merging this deploys. Closing it leaves the current pins in place.

            Bumped by the scheduled workflow; the same thing by hand is `bun run pins --write`.
