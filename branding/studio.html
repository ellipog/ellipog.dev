<!doctype html>
<!--
  studio.html - ultra-slim studio credit strip for project descriptions.
  Sits under the Bisect banner IF used: community, sponsor, studio.

  Canvas: 1920x80 (24:1). One centred row: black mark straight on the
  paper plus the wordmark. No tile, no domain. Same language as the
  rest: paper ground, ink frame, 48px blueprint grid, zero radius,
  system stacks.

  Export: open in Chromium at 100% zoom, DevTools -> select div.canvas ->
  "Capture node screenshot" -> branding/out/studio.png.

  Embed as a LINKED image (the PNG itself cannot be clicked):
    [![Engineered by Aaen Studios: aaenz.no](studio.png)](https://aaenz.no)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>studio - ellipog branding</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #09090b;
    --fg-muted: #52525b;
    --grid-line: rgba(9, 9, 11, 0.06);
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #555; font-family: var(--font-sans); }
  .canvas {
    width: 1920px; height: 80px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    background-image:
      repeating-linear-gradient(to right, var(--grid-line) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(to bottom, var(--grid-line) 0 1px, transparent 1px 48px);
    border: 4px solid var(--fg);
    color: var(--fg);
    overflow: hidden;
  }
  .mono { font-family: var(--font-mono); }

  /* One centred row: the black mark straight on the paper plus the
     wordmark. At this height a row reads; anything more shouts. */
  .lockup {
    display: flex; align-items: center; gap: 24px;
  }
  .lockup img { height: 56px; width: auto; flex: none; display: block; }
  .lockup .words {
    font-size: 27px; letter-spacing: 5px; font-weight: 700; white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="lockup mono">
      <img src="assets/aaen-mark.png" alt="Aaen Studios">
      <span class="words">ENGINEERED BY AAEN STUDIOS</span>
    </div>
  </div>
</body>
</html>
