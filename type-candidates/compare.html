<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Seven directions, one hero</title>
<!--
  A reconstruction: the real page's hero markup and the real stylesheet, once per direction. The
  per-direction screenshots in `preview.html` are the real thing -- this sheet exists so the voices
  can be compared without scrolling between seven pages.

  ?from=&to=  render a slice of the seven (each sheet then fits one screenshot)
-->
<link rel="stylesheet" href="./global.css">
<style>
  /* The seven token patches. Identical to what each direction's `css` field does on the real site. */
  [data-dir='plex'] { --font-sans: 'PlexSans', system-ui, sans-serif; --font-mono: 'PlexMono', ui-monospace, monospace }
  [data-dir='quiet'] { --font-sans: 'Schibsted', system-ui, sans-serif; --font-mono: 'Commit', ui-monospace, monospace }
  [data-dir='terminal'] { --font-sans: 'Geist', system-ui, sans-serif; --font-mono: 'Departure', ui-monospace, monospace }
  [data-dir='terminal'] .code { --font-mono: 'Commit', ui-monospace, monospace }
  [data-dir='terminal'] .brand { font-family: 'Departure', monospace; font-weight: 400; letter-spacing: 0 }
  [data-dir='blueprint'] { --font-sans: 'PlexSans', system-ui, sans-serif; --font-mono: 'PlexMono', ui-monospace, monospace }
  [data-dir='blueprint'] .hero h1, [data-dir='blueprint'] .hero-total b { font-family: 'Doto', monospace; font-variation-settings: 'ROND' 0; font-weight: 900; letter-spacing: 0 }
  [data-dir='element'] { --font-sans: 'PlexSans', system-ui, sans-serif; --font-mono: 'PlexMono', ui-monospace, monospace }
  [data-dir='element'] .hero h1, [data-dir='element'] .hero-total b, [data-dir='element'] .label, [data-dir='element'] .eyebrow, [data-dir='element'] .brand { font-family: 'Handjet', monospace; font-variation-settings: 'ELSH' 2, 'ELGR' 1; font-weight: 600; letter-spacing: 0.02em }
  [data-dir='morph'] { --font-sans: 'Sono', system-ui, sans-serif; --font-mono: 'Sono', ui-monospace, monospace }
  [data-dir='morph'] .hero h1, [data-dir='morph'] .hero .sub, [data-dir='morph'] .summary { font-variation-settings: 'MONO' 0 }
  [data-dir='morph'] .label, [data-dir='morph'] .eyebrow, [data-dir='morph'] .hero-total, [data-dir='morph'] .cell-top, [data-dir='morph'] .meta, [data-dir='morph'] .brand, [data-dir='morph'] .code { font-variation-settings: 'MONO' 1 }
  [data-dir='krypton'] { --font-sans: 'Geist', system-ui, sans-serif; --font-mono: 'Argon', ui-monospace, monospace }
  [data-dir='krypton'] .hero h1, [data-dir='krypton'] .hero-total b, [data-dir='krypton'] .label, [data-dir='krypton'] .eyebrow, [data-dir='krypton'] .brand { font-family: 'Krypton', monospace }
  [data-dir='krypton'] .code { font-feature-settings: 'calt' 1 }

  body { width: 1440px }
  main > section { border-bottom: 1px solid var(--line) }
  .tag { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--line) }
  .hero { padding: var(--s7) var(--s4) var(--s6) }
  .code { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--bg-sunken); font-family: var(--font-mono); font-size: 12.5px; color: var(--fg-muted); letter-spacing: 0.02em }
  .colophon { display: flex; justify-content: space-between; padding: 10px 16px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-faint) }
  .grid { border-top: 0 }
  .name { display: flex; align-items: center; gap: var(--s2); font-size: 16px; font-weight: 600; letter-spacing: -0.02em; margin-top: var(--s1) }
</style>

<template id="block">
  <div class="tag"><span class="label"></span><span class="faint mono"></span></div>
  <div class="hero">
    <p class="eyebrow">fabric + neoforge · minecraft</p>
    <h1>Minecraft mods.</h1>
    <p class="sub">Some released, some still being built. Everything published is on Modrinth and CurseForge.</p>
    <p class="hero-total"><b>2,637,299</b><span>downloads · modrinth + curseforge</span></p>
  </div>
  <div class="band-head"><span class="label">In development</span><span class="faint mono">1.21.1</span></div>
  <div class="grid" style="--cols:2">
    <div class="grid-cell pub-cell">
      <div class="cell-top"><span class="cell-index">1.21.1</span><span class="kind">fabric · neoforge</span></div>
      <div class="name">Tenet</div>
      <p class="summary">A questing engine. JSON files in, a pannable canvas out, and the server decides what counts as done.</p>
      <div class="meta"><span>in development</span><span class="cell-links">github ↗ · docs ↗</span></div>
    </div>
    <div class="grid-cell pub-cell">
      <div class="cell-top"><span class="cell-index">1.21.1</span><span class="kind">fabric · neoforge</span></div>
      <div class="name">Armature</div>
      <p class="summary">The library under it. Layout, themes, shapes, a graph canvas, and one seam between the code and the game's renderer.</p>
      <div class="meta"><span>in development</span><span class="cell-links">github ↗ · docs ↗</span></div>
    </div>
  </div>
  <div class="code">{"id": "tenet", "version": "0.1.0", "environment": "*"} — ./gradlew runDatagen</div>
  <div class="colophon"><span>engineered &amp; maintained by</span><span>Aaen Studios · aaenz.no</span><span>ellipog.dev</span></div>
</template>

<div class="shell">
  <header class="masthead">
    <a class="brand" href="#"><span class="site-mark" aria-hidden="true"></span>ellipog</a>
    <nav><a href="#">Docs</a><a href="#">Modrinth</a><a href="#">CurseForge</a></nav>
  </header>
  <main></main>
</div>

<script type="module">
  import { facesCss, directions } from './directions.mjs';
  document.head.insertAdjacentHTML('beforeend', `<style>${facesCss}</style>`);

  const q = new URLSearchParams(location.search);
  const slice = directions.slice(Number(q.get('from') ?? 0), Number(q.get('to') ?? directions.length));
  const block = document.getElementById('block').content;
  const main = document.querySelector('main');

  for (const d of slice) {
    const sec = document.createElement('section');
    sec.dataset.dir = d.id;
    sec.append(block.cloneNode(true));
    sec.querySelector('.tag .label').textContent = `${d.n} · ${d.name.toLowerCase()}`;
    sec.querySelector('.tag .mono').textContent = d.faces;
    main.append(sec);
  }

  await document.fonts.ready;
  document.title = 'ready';
</script>
</html>
