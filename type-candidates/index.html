<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>ellipog.dev — typeface candidates</title>
<style>
  :root {
    --bg: #fff; --fg: #09090b; --fg-muted: #52525b; --fg-faint: #a1a1aa;
    --line: #e4e4e7; --sunken: #fafafa;
    --font-mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --font-sans: system-ui, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.6 var(--font-sans); background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; height: 56px; border-bottom: 1px solid var(--line); flex: none; }
  header > * { display: flex; align-items: center; height: 100%; }
  .brand { gap: 8px; padding: 0 16px; font-weight: 600; letter-spacing: -0.03em; font-size: 15px; }
  header nav { display: flex; }
  header nav button, header nav a { height: 100%; display: flex; align-items: center; padding: 0 16px; border: 0; border-left: 1px solid var(--line); font: 11.5px/1 var(--font-mono); letter-spacing: 0.04em; color: var(--fg-muted); background: none; cursor: pointer; }
  header nav button:hover { background: var(--fg); color: var(--bg); }
  main { flex: 1; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
  .list { border-right: 1px solid var(--line); overflow-y: auto; }
  .list button { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; cursor: pointer; color: var(--fg-muted); }
  .list button:hover { background: var(--sunken); }
  .list button[aria-current="true"] { background: var(--fg); color: var(--bg); }
  .list button[aria-current="true"] .n, .list button[aria-current="true"] .faces { color: rgba(255,255,255,.6); }
  .n { font: 10.5px/1 var(--font-mono); letter-spacing: 0.1em; color: var(--fg-faint); display: block; margin-bottom: 6px; }
  .list strong { display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
  .faces { display: block; font: 11px/1.4 var(--font-mono); color: var(--fg-faint); margin-top: 4px; }
  .stage { min-width: 0; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 16px; padding: 8px 16px; border-bottom: 1px solid var(--line); font: 11px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-faint); }
  .bar b { color: var(--fg-muted); font-weight: 400; }
  iframe { flex: 1; width: 100%; border: 0; }
</style>
<header>
  <span class="brand">ellipog <b style="font:400 11px/1 var(--font-mono); color:var(--fg-faint); letter-spacing:.1em">&nbsp;/ TYPE CANDIDATES</b></span>
  <nav>
    <button id="theme">dark</button>
    <a href="/">the real site ↗</a>
  </nav>
</header>
<main>
  <div class="list" id="list"></div>
  <div class="stage">
    <div class="bar"><span id="meta">—</span></div>
    <iframe id="frame" src="/"></iframe>
  </div>
</main>
<script type="module">
  import { facesCss, directions } from './directions.mjs';

  const list = document.getElementById('list');
  const frame = document.getElementById('frame');
  let theme = 'light';
  let current = null;

  for (const d of directions) {
    const b = document.createElement('button');
    b.innerHTML = `<span class="n">${d.n} · ${d.temp}</span><strong>${d.name}</strong><span class="faces">${d.faces}</span>`;
    b.onclick = () => apply(d, b);
    list.append(b);
  }

  function apply(d, btn) {
    current = d;
    [...list.children].forEach((c) => c.setAttribute('aria-current', String(c === btn)));
    document.getElementById('meta').innerHTML = `<b>${d.faces}</b> · ${d.licence}`;
    const doc = frame.contentDocument;
    if (!doc) return;
    let style = doc.getElementById('candidate');
    if (!style) {
      doc.head.insertAdjacentHTML('beforeend', '<style id="faces"></style><style id="candidate"></style>');
      doc.getElementById('faces').textContent = facesCss;
      style = doc.getElementById('candidate');
      doc.documentElement.setAttribute('data-theme', theme);
    }
    style.textContent = `:root{\n${d.css}\n}`;
  }

  frame.addEventListener('load', () => {
    if (current) apply(current, [...list.children].find((c) => c.getAttribute('aria-current') === 'true'));
  });

  document.getElementById('theme').onclick = (e) => {
    theme = theme === 'light' ? 'dark' : 'light';
    e.target.textContent = theme === 'light' ? 'dark' : 'light';
    frame.contentDocument?.documentElement.setAttribute('data-theme', theme);
  };

  // Open on the first direction once the frame is ready.
  const first = list.children[0];
  setTimeout(() => apply(directions[0], first), 300);
</script>
</html>
